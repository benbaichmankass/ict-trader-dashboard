# Basic CI for the ICT Trader Dashboard (Streamlit app on Streamlit Community Cloud).
#
# Goal: stop a broken merge from crashing the live dashboard. Two fast,
# blocking jobs run on every PR to main and on push to main (the deploy
# trigger), so a syntax/import/dependency regression is caught before
# Streamlit Cloud auto-redeploys from main.
#
# Python version: 3.12 (NOT 3.11). streamlit_app.py uses PEP 701 syntax
# (a backslash escape inside an f-string expression part, line ~1364),
# which is a hard SyntaxError on Python <= 3.11 but valid on 3.12+.
# Streamlit Community Cloud runs Python 3.12+, so CI mirrors the real
# runtime. Pinning 3.11 would falsely fail CI for code that deploys fine.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff-lint:
    # Full `ruff check .` (default rule set). The codebase is clean under
    # the default rules on 3.12, so no need to scope down to the
    # crash-class subset (E9,F63,F7,F82). If a future change introduces a
    # flood of pre-existing style hits, narrow this to
    # `ruff check --select E9,F63,F7,F82 .` to keep it green while still
    # catching syntax/undefined-name errors.
    #
    # RUFF IS PINNED to <0.16. `pip install ruff` (unpinned) pulled ruff 0.16.0
    # (2026-07-23), whose EXPANDED default ruleset floods 77 pre-existing style
    # hits (DTZ/UP045/C408/SIM117/BLE001/… — none crash-class) across
    # streamlit_app.py, reddening every PR with no code change. Bounding to the
    # last clean minor (0.15.x) restores a reproducible gate; adopting 0.16's
    # stricter defaults is a separate, deliberate cleanup, not a silent drift
    # that breaks unrelated PRs. This mirrors the bot repo's own fix
    # (ict-trading-bot requirements-dev.txt: `ruff>=0.15.0,<0.16`).
    name: ruff-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15.0,<0.16"
      - run: ruff check .

  import-smoke:
    # Byte-compile the entry point with py_compile (NOT `import streamlit_app`).
    # The module runs Streamlit calls at import time (st.set_page_config and
    # st.html at module top level), which require a Streamlit ScriptRunContext;
    # a bare `python -c "import streamlit_app"` would warn/error outside the
    # streamlit runtime. py_compile validates syntax + import structure (and
    # the 3.12 PEP 701 f-string) without executing those module-level calls.
    # Installing requirements.txt first still catches missing-dependency drift.
    name: import-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile streamlit_app.py

  webapp-api-contract:
    # THE SPA HAD NO PR-BLOCKING CHECK OF ANY KIND until this job. `ci.yml`
    # covered only the Streamlit app (ruff + py_compile, both Python), and
    # `pages.yml` builds the SPA on push to main — i.e. AFTER merge, at deploy
    # time. A broken SPA merged freely and shipped.
    #
    # What this catches, concretely: `Prop.svelte` read
    # `rd?.daily_loss_remaining` and `rd?.static_dd_remaining` from 2026-07-16
    # (#194) to 2026-08-20. Neither key has ever existed on
    # /api/bot/prop/status. Both reads resolved to null, so BOTH account-killer
    # cushions rendered as an em-dash — the app's own convention for a value the
    # producer did not send — and the thin-cushion alert, guarded on `!= null`,
    # was unreachable for 35 days on the panel whose only job is to warn before
    # a breach. Streamlit read the correct keys throughout.
    #
    # Zero dependencies (plain node, no install) so this stays fast and cannot
    # rot on a lockfile. The checker refuses to report success over an empty
    # population, and `--self-test` plants the historical defect and requires
    # the checker to catch it — a gate that cannot fail proves nothing.
    name: webapp-api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove the checker can fail
        run: node webapp/tests/api-contract.mjs --self-test
      - name: Every field a route reads must exist in its recorded payload
        run: node webapp/tests/api-contract.mjs
