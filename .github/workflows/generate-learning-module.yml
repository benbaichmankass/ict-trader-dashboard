name: generate-learning-module

# Runs the Gemini course-generation pipeline (scripts/learning/generate_module.py)
# with the repo's GEMINI_API_KEY secret, so a Learning module can be generated
# without a key ever touching a local/dev session. Two triggers:
#   * workflow_dispatch — pick a spec + whether to synthesize audio.
#   * a labelled issue  — open an issue labelled `generate-module` with an
#     optional `spec:` / `audio:` line in the body.
# The generated module is printed (summary) and uploaded as an artifact. With
# `audio: true` the synthesized audio is hosted on a GitHub Release (tag
# `learning-audio`) and each episode's `audio` (local wav) is rewritten to an
# `audio_url` (release mp3). With `commit: true` the course JSON is committed to
# data/courses/ on a review branch (never main).

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Path to the module spec JSON (fresh course)"
        default: "scripts/learning/example_spec.json"
        required: false
      from_course:
        description: "Path to an EXISTING course JSON — synthesize audio for it (no content regen). Overrides spec."
        default: ""
        required: false
      episodes:
        description: "Comma-separated episode ids to synthesize (from_course only; default: all missing audio)"
        default: ""
        required: false
      audio:
        description: "Also synthesize multi-speaker audio (true/false)"
        default: "false"
        required: false
      commit:
        description: "Commit the generated course to data/courses/ on a branch for review (true/false)"
        default: "false"
        required: false
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: generate-learning-module
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'generate-module')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Resolve inputs
        id: inp
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          SPEC="${{ github.event.inputs.spec }}"
          AUDIO="${{ github.event.inputs.audio }}"
          FROM_COURSE="${{ github.event.inputs.from_course }}"
          EPISODES="${{ github.event.inputs.episodes }}"
          COMMIT="${{ github.event.inputs.commit }}"
          # Issue-driven: parse `spec:` / `audio:` / … lines from the body (env, not inline).
          if [ "${{ github.event_name }}" = "issues" ]; then
            SPEC=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^spec:[[:space:]]*//p' | head -1)
            AUDIO=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^audio:[[:space:]]*//p' | head -1)
            FROM_COURSE=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^from_course:[[:space:]]*//p' | head -1)
            EPISODES=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^episodes:[[:space:]]*//p' | head -1)
            COMMIT=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^commit:[[:space:]]*//p' | head -1)
          fi
          echo "spec=${SPEC:-scripts/learning/example_spec.json}" >> "$GITHUB_OUTPUT"
          echo "from_course=${FROM_COURSE}" >> "$GITHUB_OUTPUT"
          echo "episodes=${EPISODES}" >> "$GITHUB_OUTPUT"
          echo "audio=${AUDIO:-false}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT:-false}" >> "$GITHUB_OUTPUT"

      - name: Key presence (no value printed)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is EMPTY/UNSET in this repo. Add it (free: https://aistudio.google.com/apikey) as an Actions secret named GEMINI_API_KEY."
            exit 1
          fi
          echo "GEMINI_API_KEY is present (length ${#GEMINI_API_KEY}; value hidden)."

      - name: Generate module
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        env:
          GEN_SPEC: ${{ steps.inp.outputs.spec }}
          GEN_FROM_COURSE: ${{ steps.inp.outputs.from_course }}
          GEN_EPISODES: ${{ steps.inp.outputs.episodes }}
          GEN_AUDIO: ${{ steps.inp.outputs.audio }}
        run: |
          set -o pipefail
          AUDIO_FLAG=""
          if [ "$GEN_AUDIO" = "true" ]; then AUDIO_FLAG="--audio"; fi
          if [ -n "$GEN_FROM_COURSE" ]; then
            # Add audio to an EXISTING course (no content regeneration).
            EP_FLAG=""
            if [ -n "$GEN_EPISODES" ]; then EP_FLAG="--episodes $GEN_EPISODES"; fi
            echo ">>> from_course=$GEN_FROM_COURSE episodes=$GEN_EPISODES"
            python scripts/learning/generate_module.py --from-course "$GEN_FROM_COURSE" --audio $EP_FLAG --out-dir generated
          else
            echo ">>> spec=$GEN_SPEC audio=$GEN_AUDIO"
            python scripts/learning/generate_module.py "$GEN_SPEC" $AUDIO_FLAG --out-dir generated
          fi
          echo "===== generated files ====="
          ls -la generated generated/audio 2>/dev/null || true

      - name: Summary (for the run log)
        run: |
          f=$(ls generated/*.json | head -1)
          echo "===== module summary: $f ====="
          python - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          print("course_id:", d.get("course_id"))
          print("title:", d.get("title"))
          print("generated_by:", d.get("generated_by"))
          print("episodes:", [(e.get("id"), len(e.get("script", []))) for e in d.get("episodes", [])])
          print("quiz_count:", len(d.get("quiz", [])))
          print("\n--- first episode, first 6 lines ---")
          for ln in (d.get("episodes") or [{}])[0].get("script", [])[:6]:
              print(f"  {ln.get('s')}: {ln.get('t','')[:160]}")
          print("\n--- first quiz question ---")
          q = (d.get("quiz") or [{}])[0]
          print(" ", q.get("q"))
          for i, o in enumerate(q.get("options", [])):
              print(f"   [{i}] {o}", "  <-- answer" if i == q.get("answer") else "")
          print("  explain:", q.get("explain"))
          PY

      # When audio was synthesized, host it off-repo on a GitHub Release (a
      # separate CDN-backed blob store — no repo/clone bloat) and rewrite each
      # episode's local `audio` (wav) to an `audio_url` (release mp3). The
      # dashboard plays an audio_url in its persistent bar WITH a speed control
      # (a Drive /preview iframe can't be sped up); the mp3 also streams with
      # range requests + CORS so <audio> seeks cleanly.
      - name: Host audio on a GitHub Release
        if: steps.inp.outputs.audio == 'true' || steps.inp.outputs.from_course != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wavs=(generated/audio/*.wav)
          if [ ${#wavs[@]} -eq 0 ]; then
            echo "No WAVs were generated; nothing to host."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          tag="learning-audio"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "Learning course audio" \
              --notes "CDN-hosted audio assets for Learning courses (generated)."
          mp3s=()
          for w in "${wavs[@]}"; do
            base="$(basename "${w%.wav}")"
            mp3="generated/audio/${base}.mp3"
            ffmpeg -y -loglevel error -i "$w" -codec:a libmp3lame -b:a 96k "$mp3"
            mp3s+=("$mp3")
          done
          gh release upload "$tag" "${mp3s[@]}" --clobber
          echo "Uploaded ${#mp3s[@]} mp3(s) to release '$tag'."
          f=$(ls generated/*.json | head -1)
          python - "$f" "$REPO" "$tag" <<'PY'
          import json, os, sys
          f, repo, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          d = json.load(open(f, encoding="utf-8"))
          base = f"https://github.com/{repo}/releases/download/{tag}"
          for ep in d.get("episodes", []):
              a = ep.get("audio")
              if a and a.endswith(".wav"):
                  name = os.path.basename(a)[:-4] + ".mp3"
                  ep["audio_url"] = f"{base}/{name}"
                  ep.pop("audio", None)   # drop the local wav ref — play from the release
          json.dump(d, open(f, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("audio_url set:", [e.get("audio_url") for e in d.get("episodes", [])])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: generated-module
          path: generated/
          if-no-files-found: warn

      # Optional publish path: commit the generated course into data/courses/ on
      # a review branch (artifacts can't be downloaded from a web session, so
      # this is how a generated course gets reviewed + propagated to the bot's
      # comms/learning/courses/). Never commits to main.
      - name: Commit generated course to a review branch
        if: steps.inp.outputs.commit == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          f=$(ls generated/*.json | head -1)
          cid=$(python -c "import json,sys; print(json.load(open('$f'))['course_id'])")
          mkdir -p data/courses
          cp "$f" "data/courses/${cid}.json"
          branch="learning/course-${cid}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "data/courses/${cid}.json"
          git commit -m "learning: generated course ${cid} (review)"
          git push -f origin "$branch"
          echo "Committed data/courses/${cid}.json to branch $branch"
